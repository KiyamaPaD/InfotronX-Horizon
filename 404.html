<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Mars Atlas</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
        :root { color-scheme: dark; }
        body
        {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            background: radial-gradient(ellipse at 30% 20%, #543b37 0%, #2a2528 38%, #0e141c 85%);
            color: #eff1f4;
            font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main
        {
            max-width: 420px;
            padding: 32px 28px;
            border: 1px solid #ffffff1f;
            border-radius: 16px;
            background: #121c26e6;
            box-shadow: 0 20px 60px #0008;
            text-align: center;
        }
        .code { font-size: 12px; letter-spacing: .28em; color: #e99570; font-weight: 700; }
        h1 { margin: 10px 0 8px; font-size: 26px; }
        p { margin: 0 0 22px; color: #b9c6d1; line-height: 1.6; font-size: 15px; }
        a
        {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 10px;
            background: #e58a66;
            color: #1a1210;
            font-weight: 700;
            text-decoration: none;
        }
        a:focus-visible { outline: 2px solid #ffbb9e; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="code">404 · OFF THE MAP</div>
        <h1>This page is not on Mars Atlas</h1>
        <p>The address may be mistyped or the page was moved. Your missions saved on this device are still there.</p>
        <a href="/">Back to the Jezero map</a>
    </main>
</body>
</html>
