name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and run tests
        run: |
          for file in src/*.js; do node --check "$file"; done
          npm test
      - name: Diagnose NASA imagery availability (manual only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/probe-nasa-tiles.mjs


  map-browser:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real map smoke test
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test live NASA image loading in browser
        run: |
          python3 -m http.server 4173 >/tmp/mars-atlas-http.log 2>&1 &
          node scripts/map-browser-smoke.mjs
      - name: Upload map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-map-browser-evidence
          path: browser-map-evidence/
          if-no-files-found: ignore


  public-site-audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[public-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published Netlify assets to the repository commit
        run: node scripts/public-site-audit.mjs
      - name: Upload public-site audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-atlas-netlify-audit
          path: public-site-audit.json
          if-no-files-found: ignore

  nasa-context-probe:
    if: contains(github.event.head_commit.message, '[context-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe verified Jezero CTX imagery
        run: node scripts/probe-jezero-context.mjs
