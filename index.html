            <main style="max-width:720px;margin:40px auto;padding:0 16px;font-family:system-ui,sans-serif;color:#e7eef4;line-height:1.6">
                <h1>Mars Atlas</h1>
                <p>Mars Atlas is a free, in-browser Mars mission-planning workspace. It needs JavaScript. With it you can draw routes on a 3D Mars built on NASA's own model and on NASA Mars Trek imagery, read slope and height from USGS CTX data near Jezero crater, compare routes by distance and relief, and run 25 small planning models for oxygen, battery, radio relay and more.</p>
                <p>It is an independent educational project, a planning aid and not a navigation tool, and it is not endorsed by NASA.</p>
