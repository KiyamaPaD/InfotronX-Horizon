<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d15" />
    <title>Test checklist | Mars Atlas</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <style>
        :root { --bg: #080d15; --panel: #101a24; --line: #2c3b49; --text: #e7eef4; --muted: #a9b8c5; --accent: #f3a480; --ok: #75d1c8; --warn: #e2c77d; }
        @media (prefers-color-scheme: light) { :root { --bg: #f6f3ef; --panel: #ffffff; --line: #ddd5cc; --text: #1d2630; --muted: #55616d; --accent: #b4552e; --ok: #1d7f74; --warn: #8a6a10; } }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
        header { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
        header strong { letter-spacing: 2px; }
        .bar { flex: 1 1 220px; height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
        .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .3s; }
        .count { color: var(--muted); font-variant-numeric: tabular-nums; }
        button, select { font: inherit; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
        button:hover { border-color: var(--accent); }
        main { max-width: 900px; margin: 0 auto; padding: 20px 20px 80px; }
        details { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
        summary { cursor: pointer; padding: 14px 18px; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
        summary small { color: var(--muted); font-weight: 400; }
        ul { list-style: none; margin: 0; padding: 0 18px 12px; }
        li { padding: 10px 0; border-top: 1px solid var(--line); }
        label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
        input[type="checkbox"] { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--ok); }
        .id { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 34px; font-weight: 700; }
        .badge { margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
        .yes { background: #1d3a37; color: var(--ok); } .partly { background: #3a331d; color: var(--warn); } .no { background: #2c3b49; color: var(--muted); }
        @media (prefers-color-scheme: light) { .yes { background: #d8f0ec; } .partly { background: #f5ecc9; } .no { background: #e7e2db; } }
        .how { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }
        li.done .text { text-decoration: line-through; opacity: .6; }
        li[hidden] { display: none; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <header>
        <strong>MARS ATLAS · TEST CHECKLIST</strong>
        <div class="bar" aria-hidden="true"><i id="bar"></i></div>
        <span class="count" id="count"></span>
        <a href="./">← Back to the app</a>
    </header>
    <main>
        <p>Every request from the review prompt, in order. <strong>Built</strong> means it is in the code and waiting for your check; tick the box once you have tried it and it works. Your ticks stay in this browser.</p>
        <div class="toolbar">
            <select id="filter" aria-label="Show"><option value="all">Show everything</option><option value="open">Show what is not ticked</option><option value="done">Show what is ticked</option><option value="built">Show what is built</option><option value="todo">Show what is still to do</option></select>
            <button type="button" id="copy">Copy the report</button>
            <button type="button" id="reset">Clear all ticks</button>
        </div>
        <div id="phases"></div>
    </main>
    <script type="module" src="./src/qa-checklist.js"></script>
</body>
</html>
